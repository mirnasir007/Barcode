<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Barcode Printer</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #00bcd4; text-align: center; margin-top: 0; margin-bottom: 25px; }
    
    .input-section { display: flex; gap: 15px; background: #e0f7fa; padding: 20px; border-radius: 8px; align-items: flex-end; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 150px; position: relative; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #333; font-size: 14px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; outline: none; }
    input[type="text"] { text-transform: uppercase; }
    input:focus { border-color: #00bcd4; }
    
    .btn { background: #00bcd4; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; height: 44px; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn:hover { background: #008ba3; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 25px; background: white; }
    th { background-color: #00bcd4; color: white; padding: 12px; border: 1px solid #ddd; text-align: left; }
    td { padding: 12px; border: 1px solid #ddd; text-align: left; vertical-align: middle; }
    
    .remove-btn { background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .remove-btn:hover { background: #d32f2f; }

    .print-section { margin-top: 25px; text-align: center; }
    .btn-print { background: #9C27B0; font-size: 18px; padding: 15px 30px; }
    .btn-print:hover { background: #7B1FA2; }
    
    #loaderMsg { color: #ff9800; font-weight: bold; margin-top: 10px; display: none; font-size: 14px; }

    #suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      z-index: 1000;
      max-height: 250px;
      overflow-y: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 4px;
      display: none;
      margin-top: 5px;
    }
    .sugg-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      color: #333;
    }
    .sugg-item:hover {
      background: #e0f7fa;
    }
    .sugg-item strong {
      color: #00bcd4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🖨️ Quick Barcode Printer</h2>
    
    <div class="input-section">
      <div class="form-group" style="flex: 2;">
        <label>Scan / Enter SKU (Press Enter) *</label>
        <input type="text" id="skuInput" autocomplete="off" oninput="this.value = this.value.toUpperCase()">
        <div id="suggestions"></div>
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Print QTY *</label>
        <input type="number" id="qtyInput" value="" min="1" autocomplete="off">
      </div>
      <button class="btn" id="addBtn" onclick="fetchAndAddProduct()">➕ Add To List</button>
    </div>
    <div id="loaderMsg">⏳ Fetching POS Data... Please wait.</div>

    <table id="printTable" style="display: none;">
      <thead>
        <tr>
          <th>SKU (Base)</th>
          <th>Full Barcode</th>
          <th>Product Name</th>
          <th>Price (MRP)</th>
          <th>Print QTY</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="printBody"></tbody>
    </table>

    <div class="print-section" id="printSection" style="display: none;">
      <button class="btn btn-print" onclick="generateBarcodes()">🖨️ Generate & Print Barcodes</button>
    </div>
  </div>

  <script>
    // Live Render Server URL (Render theke link pawar por ekhane boshaben)
    const SCRIPT_URL = "https://barcodebackend-21jf.onrender.com/api"; 
    
    let printList = [];
    let searchTimeout;

    // Enter key press korle focus change korar jonno
    document.getElementById("skuInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        closeSuggestions();
        document.getElementById("qtyInput").focus();
      }
    });

    document.getElementById("qtyInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        fetchAndAddProduct();
      }
    });

    // Search Suggestions er jonno api call
    document.getElementById("skuInput").addEventListener("input", function(e) {
      clearTimeout(searchTimeout);
      let val = e.target.value.trim().toUpperCase();
      
      if (val.length < 3) {
        closeSuggestions();
        return;
      }
      
      searchTimeout = setTimeout(() => {
        performSearch(val);
      }, 400);
    });

    async function performSearch(term) {
      let suggBox = document.getElementById("suggestions");
      suggBox.innerHTML = '<div class="sugg-item">⏳ Searching...</div>';
      suggBox.style.display = "block";

      try {
        let response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ action: "search", term: term })
        });
        
        let rawText = await response.text();
        let data;
        try { data = JSON.parse(rawText); } catch(e) { data = {}; }

        let items = [];
        if (Array.isArray(data)) items = data;
        else if (data.ProductList && Array.isArray(data.ProductList)) items = data.ProductList;
        else if (data.Data && Array.isArray(data.Data)) items = data.Data;
        else if (data.data && Array.isArray(data.data)) items = data.data;
        else if (data.DataList && Array.isArray(data.DataList)) items = data.DataList;
        else if (data.results && Array.isArray(data.results)) items = data.results;
        else {
           for(let key in data) {
              if(Array.isArray(data[key])) { items = data[key]; break; }
           }
        }
        
        if (items.length === 0) {
          suggBox.innerHTML = '<div class="sugg-item" style="color:red;">No products found</div>';
          return;
        }

        suggBox.innerHTML = '';
        items.forEach(item => {
          // --- UPDATE: Brand Name chara exact Name anar jonno ---
          let barcode = item.BARCODE || item.SKU || item.Barcode || item.PROD_CODE || '';
          let name = item.NAME || item.DISPLAY_NAME || item.PRODUCT_NAME || item.BARCODE_NAME || 'Unknown Product';
          
          if(barcode) {
              let div = document.createElement('div');
              div.className = 'sugg-item';
              div.innerHTML = `<strong>${barcode.toUpperCase()}</strong> - ${name}`;
              div.onclick = function() {
                document.getElementById("skuInput").value = barcode.toUpperCase();
                closeSuggestions();
                document.getElementById("qtyInput").focus();
              };
              suggBox.appendChild(div);
          }
        });
      } catch (error) {
        suggBox.innerHTML = '<div class="sugg-item" style="color:red;">Network Error</div>';
      }
    }

    function closeSuggestions() {
      document.getElementById("suggestions").style.display = "none";
    }

    // Baire click korle suggestion box bondho hobe
    document.addEventListener("click", function(e) {
      let skuInput = document.getElementById("skuInput");
      let suggBox = document.getElementById("suggestions");
      if (!skuInput.contains(e.target) && !suggBox.contains(e.target)) {
        closeSuggestions();
      }
    });

    // Add to list button er kaaj
    async function fetchAndAddProduct() {
      let skuInput = document.getElementById("skuInput");
      let qtyInput = document.getElementById("qtyInput");
      let sku = skuInput.value.trim().toUpperCase();
      let qtyVal = qtyInput.value.trim();
      let qty = parseInt(qtyVal);
      
      if (isNaN(qty) || qty < 1) qty = 1;

      if (!sku) {
        alert("Please enter an SKU first!");
        skuInput.focus();
        return;
      }

      // Jodi sku aage thekei list e thake, tobe shudhu quantity barabe
      let existingIndex = printList.findIndex(item => item.sku === sku);
      if (existingIndex !== -1) {
        printList[existingIndex].qty += qty;
        renderTable();
        resetFields();
        return;
      }

      skuInput.disabled = true;
      qtyInput.disabled = true;
      document.getElementById("addBtn").disabled = true;
      document.getElementById("loaderMsg").style.display = "block";

      try {
        let response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ action: "check_bulk", sku: sku })
        });

        let resData = await response.json();

        if (resData.success && resData.data && resData.data.name && resData.data.name !== "Unknown Product") {
            let pData = resData.data;
            
            // --- UPDATE: Base SKU ebong Full Barcode er logic ---
            let vendorCode = pData.vendorCode || ""; 
            let baseSku = sku;
            
            let knownVendors = ["1001", "1002", "1003", "1004"];
            let detectedVendor = knownVendors.find(v => sku.endsWith(v));
            
            if (detectedVendor) {
                baseSku = sku.substring(0, sku.length - detectedVendor.length);
                if (!vendorCode) {
                    vendorCode = detectedVendor;
                }
            }
            let fullBarcode = baseSku + vendorCode;

            // --- UPDATE: Clean product name nibe (No split/pop needed) ---
            let finalName = pData.name;
            
            printList.push({
                sku: baseSku, 
                fullBarcode: fullBarcode.toUpperCase(),
                name: finalName,
                price: parseFloat(pData.mrp || 0),
                qty: qty
            });
            
            renderTable();
            resetFields();
        } else {
            alert("Product not found in POS API!");
            resetFields(false);
        }
      } catch (error) {
        alert("Network Error! Could not connect to API.");
        resetFields(false);
      }
    }

    function resetFields(clearData = true) {
      let skuInput = document.getElementById("skuInput");
      let qtyInput = document.getElementById("qtyInput");
      
      skuInput.disabled = false;
      qtyInput.disabled = false;
      document.getElementById("addBtn").disabled = false;
      document.getElementById("loaderMsg").style.display = "none";
      
      if (clearData) {
        skuInput.value = "";
        qtyInput.value = "";
      }
      skuInput.focus();
    }

    function renderTable() {
      let tbody = document.getElementById("printBody");
      tbody.innerHTML = "";

      if (printList.length === 0) {
        document.getElementById("printTable").style.display = "none";
        document.getElementById("printSection").style.display = "none";
        return;
      }

      printList.forEach((item, index) => {
        let formattedPrice = item.price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        tbody.innerHTML += `
          <tr>
            <td>${item.sku}</td>
            <td style="font-weight:bold; color:#9C27B0;">${item.fullBarcode}</td>
            <td>${item.name}</td>
            <td>${formattedPrice}</td>
            <td>
              <input type="number" value="${item.qty}" min="1" 
                style="width:60px; padding:5px; border:1px solid #ccc; border-radius:4px;" 
                onchange="updateQty(${index}, this.value)">
            </td>
            <td><button class="remove-btn" onclick="removeItem(${index})">Remove</button></td>
          </tr>
        `;
      });

      document.getElementById("printTable").style.display = "table";
      document.getElementById("printSection").style.display = "block";
    }

    function removeItem(index) {
      printList.splice(index, 1);
      renderTable();
    }

    function updateQty(index, val) {
      let newQty = parseInt(val);
      if (!isNaN(newQty) && newQty >= 1) {
        printList[index].qty = newQty;
      } else {
        renderTable(); // Reset jodi keu vul/negative number dey
      }
    }

    function generateBarcodes() {
        if (printList.length === 0) return;
        let labels = [];

        printList.forEach(item => {
            let formattedPrice = item.price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            for (let j = 0; j < item.qty; j++) {
                labels.push({
                    code: item.fullBarcode,
                    productName: item.name,
                    price: formattedPrice
                });
            }
        });

        printBarcodes(labels);
    }

// Browser Print theke Barcode Print kora
    function printBarcodes(labels) { 
        var perPage = 65; // 5 columns x 13 rows
        var htmlContent = ''; 
        for (var i = 0; i < labels.length; i += perPage) { 
            var pageLabels = labels.slice(i, i + perPage); 
            htmlContent += '<div class="page">' + pageLabels.map(function(l) { 
                var u = 'https://bwipjs-api.metafloor.com/?bcid=code128&text=' + encodeURIComponent(l.code) + '&scale=1&width=200&height=40&includetext=false'; 
                return `<div class="label"><div class="store">PFF PREMIUM</div><div class="product">${l.productName || ""}</div><img class="barcode" src="${u}" alt="Barcode for ${l.code}"><div class="code">${l.code}</div><div class="price">Price:${l.price}+ VAT</div></div>`; 
            }).join('') + '</div>'; 
        } 
        
        var bH = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>📦 Barcode Labels</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;}
  .print-button{position:fixed;top:10px;right:20px;padding:10px 20px;font-size:16px;z-index:999;background:#007bff;color:white;border:none;border-radius:5px;cursor:pointer;}
  .page{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(13,1fr);column-gap:1px;row-gap:2px;width:820px;height:1120px;margin:0 auto;box-sizing:border-box;padding:10px 5px;page-break-after:always;page-break-inside:avoid;break-inside:avoid;overflow:hidden;}
  .label{width:100%;height:82px;border:none;padding:1px;box-sizing:border-box;text-align:center;font-size:9px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;page-break-inside:avoid;break-inside:avoid;}
  .store{font-weight:bold;font-size:10px;}
.product{font-size:8px;line-height:1.0;word-wrap:break-word;max-height:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:2px;}
          .code{font-size:8px;letter-spacing:0.5px;margin-top:1px;}
          .price{font-weight:bold;font-size:9px;color:#000;}
          img.barcode{display:block;margin:0 auto;max-height:28px;width:120px;object-fit:contain;}
  @media print{.print-button{display:none!important;}@page{size:A4;margin:0;}}
</style>
</head><body><button class="print-button" onclick="window.print()">🖨️ Print</button>${htmlContent}</body></html>`; 
        
        var pW = window.open('', '_blank'); 
        pW.document.write(bH); 
        pW.document.close(); 
    }
  </script>
</body>
</html>
